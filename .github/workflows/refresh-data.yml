name: Refresh source data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install refresh dependencies
        run: python -m pip install pandas

      - name: Refresh validated source files
        env:
          MONTHLY_DATA_URL: ${{ secrets.MONTHLY_DATA_URL }}
          GDP_DATA_URL: ${{ secrets.GDP_DATA_URL }}
        run: |
          if [ -z "$MONTHLY_DATA_URL" ] || [ -z "$GDP_DATA_URL" ]; then
            echo "Refresh skipped: configure MONTHLY_DATA_URL and GDP_DATA_URL repository secrets."
            exit 0
          fi
          python -m src.ghana_banking.data.refresh

      - name: Commit refreshed data when changed
        run: |
          if git diff --quiet -- data/raw/data_first.csv data/raw/data_first2.csv; then
            echo "No source data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/data_first.csv data/raw/data_first2.csv
          git commit -m "data: refresh official source datasets"
          git push
